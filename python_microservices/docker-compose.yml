
services:

  mongodb:
    image: mongo:7
    container_name: taskflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-service:
    build: ./task-service
    container_name: taskflow-task-service
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: task_service_db
      # Note: "notification-service" here is the Docker Compose service
      # name, which Docker's internal DNS resolves automatically.
      NOTIFICATION_SERVICE_URL: http://notification-service:8001
    depends_on:
      mongodb:
        condition: service_healthy
      notification-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: taskflow-notification-service
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: notification_service_db
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: taskflow-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - task-service
      - notification-service

volumes:
  mongo_data: