<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDFC Bank Financial RAG</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 22px; color: #38bdf8; }
        .btn-ingest { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .chat-box { background: #1e293b; border-radius: 8px; padding: 20px; min-height: 400px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
        .msg.user { background: #0369a1; align-self: flex-end; max-width: 80%; }
        .msg.bot { background: #334155; align-self: flex-start; max-width: 90%; white-space: pre-wrap; }
        .citations { margin-top: 8px; font-size: 12px; color: #94a3b8; border-top: 1px dashed #475569; padding-top: 6px; }
        .input-bar { display: flex; gap: 10px; }
        select, input, button { font-size: 14px; padding: 12px; border-radius: 6px; border: 1px solid #475569; }
        select { background: #1e293b; color: white; }
        input { flex: 1; background: #1e293b; color: white; }
        .btn-send { background: #22c55e; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>HDFC Bank Report RAG</h1>
            <small style="color: #94a3b8;">FY 2024-25 Financial Analyzer</small>
        </div>
        <button class="btn-ingest" onclick="triggerIngest()">Re-run Ingestion</button>
    </header>

    <div class="chat-box" id="chat">
        <div class="msg bot">Hello! Ask any question regarding HDFC Bank's FY25 Financial Statements, NPAs, Borrowings, or ESG metrics.</div>
    </div>

    <div class="input-bar">
        <select id="scopeSelect">
            <option value="All">All Scopes</option>
            <option value="Standalone">Standalone Only</option>
            <option value="Consolidated">Consolidated Only</option>
            <option value="ESG">ESG / BRSR</option>
        </select>
        <input type="text" id="queryInput" placeholder="e.g. Compare Standalone vs Consolidated Net Profit for FY25..." onkeydown="if(event.key==='Enter') sendQuery()" />
        <button class="btn-send" onclick="sendQuery()">Ask</button>
    </div>
</div>

<script>
async function sendQuery() {
    const input = document.getElementById("queryInput");
    const query = input.value.trim();
    const scope = document.getElementById("scopeSelect").value;
    if (!query) return;

    const chat = document.getElementById("chat");
    chat.innerHTML += `<div class="msg user">${query}</div>`;
    input.value = "";

    const loadingId = "load-" + Date.now();
    chat.innerHTML += `<div class="msg bot" id="${loadingId}">Analyzing financial reports...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("/api/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, scope })
        });

        const data = await res.json();
        const answerText = data && data.answer ? data.answer : (data && data.detail ? data.detail : "No answer returned.");

        let citationHtml = "";
        if (data && data.citations && data.citations.length > 0) {
            const pages = data.citations.map(c => `Pg. ${c.page} (${c.scope})`).join(", ");
            citationHtml = `<div class="citations">Sources: ${pages}</div>`;
        }

        document.getElementById(loadingId).innerHTML = answerText + citationHtml;
    } catch (err) {
        document.getElementById(loadingId).innerText = "Error: " + (err && err.message ? err.message : "Request failed");
    }
    chat.scrollTop = chat.scrollHeight;
}

async function triggerIngest() {
    if (!confirm("Start ingestion? This will process the PDF and populate ChromaDB.")) return;
    alert("Ingestion started in background. Check your terminal logs.");
    await fetch("/api/ingest", { method: "POST" });
}
</script>
</body>
</html>
